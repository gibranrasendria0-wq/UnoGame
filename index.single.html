<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Color Clash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #d32f2f;
      --blue: #1976d2;
      --green: #388e3c;
      --yellow: #fbc02d;
      --black: #212121;
      --bg: #1a237e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(ellipse at center, #283593 0%, #1a237e 50%, #0d1440 100%);
      min-height: 100dvh;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ========== LOBBY ========== */
    #lobby {
      width: 100%;
      max-width: 440px;
      padding: 20px 18px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .logo-box {
      margin-top: 12px;
      text-align: center;
    }

    .logo-uno {
      font-size: 4.2rem;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffeb3b 0%, #fbc02d 40%, #f57f17 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 4px 0 #c62828) drop-shadow(0 8px 12px rgba(0,0,0,0.4));
      line-height: 1;
    }

    .logo-sub {
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0.85;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.7;
      align-self: flex-start;
      margin-bottom: -6px;
    }

    .mode-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .mode-card {
      background: rgba(255,255,255,0.1);
      border: 3px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-card.active {
      background: rgba(255,235,59,0.2);
      border-color: #ffeb3b;
      box-shadow: 0 0 0 3px rgba(255,235,59,0.25);
    }

    .mode-card .icon { font-size: 2.2rem; margin-bottom: 6px; }
    .mode-card h3 { font-size: 1.05rem; font-weight: 800; }
    .mode-card p { font-size: 0.75rem; opacity: 0.7; margin-top: 2px; }

    .diff-section, .players-section {
      width: 100%;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      padding: 14px;
      display: none;
    }

    .diff-section.show, .players-section.show { display: block; }

    .diff-btns, .player-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .diff-btn, .player-btn {
      flex: 1;
      padding: 12px 6px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .diff-btn.active, .player-btn.active {
      background: #ffeb3b;
      color: #1a237e;
      border-color: #ffeb3b;
      box-shadow: 0 4px 12px rgba(255,235,59,0.4);
    }

    .diff-btn[data-diff="easy"].active { background: #66bb6a; border-color: #66bb6a; color: #fff; }
    .diff-btn[data-diff="normal"].active { background: #ffeb3b; border-color: #ffeb3b; color: #1a237e; }
    .diff-btn[data-diff="impossible"].active { background: #ef5350; border-color: #ef5350; color: #fff; }

    .btn-start {
      width: 100%;
      max-width: 320px;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(180deg, #ffeb3b 0%, #fbc02d 100%);
      color: #1a237e;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #c62828, 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.15s;
      margin-top: 8px;
    }

    .btn-start:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #c62828, 0 4px 10px rgba(0,0,0,0.3);
    }

    .music-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      z-index: 100;
    }

    /* ========== GAME ========== */
    #game {
      display: none;
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      flex-direction: column;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.35);
    }

    .btn-lobby {
      padding: 7px 14px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .turn-msg {
      font-size: 0.9rem;
      font-weight: 800;
      background: rgba(255,235,59,0.2);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,235,59,0.4);
    }

    .player-info {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 8px 4px;
    }

    .player-badge {
      background: rgba(0,0,0,0.35);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid transparent;
      transition: all 0.25s;
    }

    .player-badge.active {
      background: #ffeb3b;
      color: #1a237e;
      border-color: #fff;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(255,235,59,0.5);
    }

    .player-badge .count {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 900;
      min-width: 22px;
      text-align: center;
    }

    .player-badge.active .count {
      background: rgba(26,35,126,0.25);
    }

    .table-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 8px;
      position: relative;
    }

    .table-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .direction-indicator {
      font-size: 1.5rem;
      transition: transform 0.35s;
    }

    .direction-indicator.reverse { transform: scaleX(-1); }

    .current-color {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .discard-pile {
      width: 96px;
      height: 140px;
      border-radius: 12px;
      position: relative;
      z-index: 5;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45));
    }

    .draw-pile {
      width: 72px;
      height: 104px;
      background: linear-gradient(145deg, #37474f, #263238);
      border-radius: 10px;
      border: 3px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #ffeb3b;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      transition: transform 0.12s;
    }

    .draw-pile:active { transform: translateY(-50%) scale(0.93); }

    .draw-pile::before {
      content: 'UNO';
      position: absolute;
      font-size: 0.85rem;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    .hand-area {
      background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.5) 100%);
      padding: 10px 6px 18px;
      border-radius: 24px 24px 0 0;
      min-height: 155px;
    }

    .hand {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding: 12px 4px 4px;
      scrollbar-width: none;
    }

    .hand::-webkit-scrollbar { display: none; }

    /* ===== REAL UNO CARD STYLE ===== */
    .card {
      width: 74px;
      height: 108px;
      border-radius: 10px;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-left: -20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      border: 2.5px solid rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card:first-child { margin-left: 0; }

    .card:hover, .card.playable {
      transform: translateY(-20px) scale(1.07);
      z-index: 20;
      box-shadow: 0 14px 28px rgba(0,0,0,0.5);
    }

    .card.playable {
      outline: 3px solid #ffeb3b;
      outline-offset: 2px;
    }

    /* Card backgrounds */
    .card.red { background: linear-gradient(160deg, #e53935, #b71c1c); }
    .card.blue { background: linear-gradient(160deg, #1e88e5, #0d47a1); }
    .card.green { background: linear-gradient(160deg, #43a047, #1b5e20); }
    .card.yellow { background: linear-gradient(160deg, #fdd835, #f9a825); color: #212121; }
    .card.wild { background: linear-gradient(160deg, #424242, #212121); }

    /* Oval center */
    .card .oval {
      width: 48px;
      height: 72px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transform: rotate(-15deg);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08);
    }

    .card.yellow .oval { background: #fffde7; }

    .card .oval-val {
      font-size: 1.55rem;
      font-weight: 900;
      transform: rotate(15deg);
      line-height: 1;
    }

    .card.red .oval-val { color: #c62828; }
    .card.blue .oval-val { color: #1565c0; }
    .card.green .oval-val { color: #2e7d32; }
    .card.yellow .oval-val { color: #f9a825; }
    .card.wild .oval-val { color: #212121; font-size: 1.3rem; }

    .card .corner {
      position: absolute;
      font-size: 0.85rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
    }

    .card.yellow .corner { color: #212121; }

    .card .corner.tl { top: 5px; left: 6px; }
    .card .corner.br { bottom: 5px; right: 6px; transform: rotate(180deg); }

    /* Wild special look */
    .card.wild .oval {
      background: conic-gradient(#e53935 0deg 90deg, #fdd835 90deg 180deg, #43a047 180deg 270deg, #1e88e5 270deg 360deg);
    }

    .card.wild .oval-val {
      background: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #212121;
    }

    /* ========== MODALS ========== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(5px);
    }

    .modal.show { display: flex; animation: fadeIn 0.25s ease; }

    .modal-content {
      background: linear-gradient(180deg, #283593, #1a237e);
      border-radius: 22px;
      padding: 26px 22px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      border: 3px solid rgba(255,235,59,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .modal-content h2 {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-btn {
      height: 68px;
      border-radius: 14px;
      border: 3px solid rgba(255,255,255,0.3);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }

    .color-btn:active { transform: scale(0.94); }
    .color-btn.red { background: var(--red); }
    .color-btn.blue { background: var(--blue); }
    .color-btn.green { background: var(--green); }
    .color-btn.yellow { background: var(--yellow); color: #212121; text-shadow: none; }

    .gameover-content .trophy { font-size: 3.8rem; margin-bottom: 6px; }
    .gameover-content h2 { font-size: 1.5rem; margin-bottom: 6px; }
    .gameover-content p { opacity: 0.85; margin-bottom: 22px; font-weight: 700; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; }

    .btn-primary {
      padding: 14px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(180deg, #ffeb3b, #fbc02d);
      color: #1a237e;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #c62828;
    }

    .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #c62828; }

    .btn-secondary {
      padding: 12px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.35);
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(0,0,0,0.88);
      color: #fff;
      padding: 11px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s;
      z-index: 150;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .uno-btn {
      position: absolute;
      bottom: 175px;
      right: 14px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ef5350, #c62828);
      border: 3px solid #fff;
      color: #fff;
      font-family: inherit;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(198,40,40,0.5);
      z-index: 20;
      display: none;
      animation: pulse 1.1s infinite;
    }

    .uno-btn.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pass-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13,20,64,0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      gap: 14px;
    }

    .pass-overlay.show { display: flex; }
    .pass-overlay h2 { font-size: 1.45rem; font-weight: 900; }
    .pass-overlay p { opacity: 0.7; font-weight: 700; }

    @media (max-width: 400px) {
      .card { width: 64px; height: 94px; margin-left: -24px; }
      .card .oval { width: 40px; height: 60px; }
      .card .oval-val { font-size: 1.3rem; }
      .discard-pile { width: 82px; height: 120px; }
      .logo-uno { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <button class="music-toggle" id="musicBtn">🔊</button>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="logo-box">
      <div class="logo-uno">UNO</div>
      <div class="logo-sub">COLOR CLASH</div>
    </div>

    <div class="section-title">Pilih Mode</div>
    <div class="mode-cards">
      <div class="mode-card active" data-mode="ai" onclick="selectMode('ai')">
        <div class="icon">🤖</div>
        <h3>vs AI</h3>
        <p>Lawan Bot</p>
      </div>
      <div class="mode-card" data-mode="multi" onclick="selectMode('multi')">
        <div class="icon">👥</div>
        <h3>Multiplayer</h3>
        <p>Pass & Play</p>
      </div>
    </div>

    <div class="diff-section show" id="diffSection">
      <div class="section-title" style="margin-bottom:4px;">Tingkat Kesulitan AI</div>
      <div class="diff-btns">
        <button class="diff-btn" data-diff="easy" onclick="setDiff('easy')">Easy</button>
        <button class="diff-btn active" data-diff="normal" onclick="setDiff('normal')">Normal</button>
        <button class="diff-btn" data-diff="impossible" onclick="setDiff('impossible')">Impossible</button>
      </div>
    </div>

    <div class="players-section" id="playersSection">
      <div class="section-title" style="margin-bottom:4px;">Jumlah Pemain</div>
      <div class="player-btns">
        <button class="player-btn" data-n="2" onclick="setPlayers(2)">2</button>
        <button class="player-btn active" data-n="3" onclick="setPlayers(3)">3</button>
        <button class="player-btn" data-n="4" onclick="setPlayers(4)">4</button>
      </div>
    </div>

    <button class="btn-start" onclick="startGame()">MAINKAN 🎮</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="top-bar">
      <button class="btn-lobby" onclick="confirmLobby()">← Lobby</button>
      <div class="turn-msg" id="turnMsg">Giliranmu</div>
      <div style="width:58px;"></div>
    </div>

    <div class="player-info" id="playerInfo"></div>

    <div class="table-area">
      <div class="table-meta">
        <div class="direction-indicator" id="direction">➡️</div>
        <div class="current-color" id="currentColor"></div>
      </div>
      <div class="discard-pile" id="discardPile"></div>
      <div class="draw-pile" id="drawPile" onclick="drawCard()"></div>
      <button class="uno-btn" id="unoBtn" onclick="callUno()">UNO!</button>
    </div>

    <div class="hand-area">
      <div class="hand" id="hand"></div>
    </div>

    <div class="pass-overlay" id="passOverlay">
      <h2 id="passName">Giliran Player 2</h2>
      <p>Serahkan HP ke pemain berikutnya</p>
      <button class="btn-primary" style="max-width:220px;margin-top:8px;" onclick="revealHand()">Saya Siap</button>
    </div>
  </div>

  <!-- Color Picker -->
  <div class="modal" id="colorModal">
    <div class="modal-content">
      <h2>Pilih Warna</h2>
      <div class="color-grid">
        <button class="color-btn red" onclick="chooseColor('red')">Merah</button>
        <button class="color-btn blue" onclick="chooseColor('blue')">Biru</button>
        <button class="color-btn green" onclick="chooseColor('green')">Hijau</button>
        <button class="color-btn yellow" onclick="chooseColor('yellow')">Kuning</button>
      </div>
    </div>
  </div>

  <!-- Game Over -->
  <div class="modal" id="gameOverModal">
    <div class="modal-content gameover-content">
      <div class="trophy" id="trophy">🏆</div>
      <h2 id="winnerText">Kamu Menang!</h2>
      <p id="scoreText">Hebat!</p>
      <div class="btn-group">
        <button class="btn-primary" onclick="tryAgain()">Coba Lagi</button>
        <button class="btn-secondary" onclick="backToLobby()">Kembali ke Lobby</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <audio id="bgm" loop preload="auto">
    <source src="https://soundimage.org/wp-content/uploads/2020/12/Adventures-in-Suburbia.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ========== STATE ==========
    let mode = 'ai';
    let difficulty = 'normal';
    let numPlayers = 2;
    let players = [];
    let currentPlayer = 0;
    let direction = 1;
    let deck = [];
    let discard = [];
    let currentColor = null;
    let gameOver = false;
    let waitingColor = false;
    let mustDraw = 0;
    let calledUno = {};
    let musicOn = true;
    let lastSettings = { mode: 'ai', difficulty: 'normal', numPlayers: 2 };

    const COLORS = ['red', 'blue', 'green', 'yellow'];

    // ========== AUDIO ==========
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicBtn');

    function toggleMusic() {
      musicOn = !musicOn;
      if (musicOn) {
        bgm.play().catch(()=>{});
        musicBtn.textContent = '🔊';
      } else {
        bgm.pause();
        musicBtn.textContent = '🔇';
      }
    }
    musicBtn.onclick = toggleMusic;

    function playSfx(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'play') { osc.frequency.value = 540; gain.gain.value = 0.07; }
        else if (type === 'draw') { osc.frequency.value = 300; gain.gain.value = 0.06; }
        else if (type === 'win') { osc.frequency.value = 700; gain.gain.value = 0.09; }
        else { osc.frequency.value = 220; gain.gain.value = 0.05; }
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
        osc.stop(ctx.currentTime + 0.14);
      } catch(e) {}
    }

    // ========== LOBBY ==========
    function selectMode(m) {
      mode = m;
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
      document.querySelector(`[data-mode="${m}"]`).classList.add('active');
      document.getElementById('diffSection').classList.toggle('show', m === 'ai');
      document.getElementById('playersSection').classList.toggle('show', m === 'multi');
      if (m === 'ai') numPlayers = 2;
    }

    function setDiff(d) {
      difficulty = d;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.diff-btn[data-diff="${d}"]`).classList.add('active');
    }

    function setPlayers(n) {
      numPlayers = n;
      document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.player-btn[data-n="${n}"]`).classList.add('active');
    }

    // ========== DECK ==========
    function createDeck() {
      const d = [];
      COLORS.forEach(color => {
        d.push({ color, value: '0' });
        for (let i = 1; i <= 9; i++) {
          d.push({ color, value: String(i) });
          d.push({ color, value: String(i) });
        }
        ['skip','reverse','draw2'].forEach(v => {
          d.push({ color, value: v });
          d.push({ color, value: v });
        });
      });
      for (let i = 0; i < 4; i++) {
        d.push({ color: 'wild', value: 'wild' });
        d.push({ color: 'wild', value: 'wild4' });
      }
      return shuffle(d);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ========== START ==========
    function startGame() {
      lastSettings = { mode, difficulty, numPlayers };
      gameOver = false;
      direction = 1;
      mustDraw = 0;
      calledUno = {};
      currentPlayer = 0;

      deck = createDeck();
      discard = [];
      players = [];

      for (let i = 0; i < numPlayers; i++) {
        const hand = [];
        for (let j = 0; j < 7; j++) hand.push(deck.pop());
        players.push({
          name: mode === 'ai' ? (i === 0 ? 'Kamu' : 'Bot') : `Player ${i + 1}`,
          hand,
          isAI: mode === 'ai' && i > 0
        });
      }

      let first;
      do {
        first = deck.pop();
        if (first.color === 'wild' || ['skip','reverse','draw2'].includes(first.value)) {
          deck.unshift(first);
          deck = shuffle(deck);
        } else break;
      } while (true);
      discard.push(first);
      currentColor = first.color;

      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game').style.display = 'flex';
      renderAll();

      if (musicOn) bgm.play().catch(()=>{});

      if (players[currentPlayer].isAI) setTimeout(aiTurn, 700);
      else if (mode === 'multi' && currentPlayer !== 0) showPassOverlay();
    }

    // ========== RENDER ==========
    function renderAll() {
      renderPlayerInfo();
      renderDiscard();
      renderHand();
      renderDirection();
      updateTurnMsg();
      updateUnoBtn();
    }

    function renderPlayerInfo() {
      const el = document.getElementById('playerInfo');
      el.innerHTML = players.map((p, i) => `
        <div class="player-badge ${i === currentPlayer ? 'active' : ''}">
          ${p.name} <span class="count">${p.hand.length}</span>
        </div>
      `).join('');
    }

    function renderDiscard() {
      const top = discard[discard.length - 1];
      const pile = document.getElementById('discardPile');
      pile.innerHTML = '';
      const card = createCardElement(top, true);
      card.style.width = '96px';
      card.style.height = '140px';
      card.style.margin = '0';
      card.style.borderRadius = '12px';
      pile.appendChild(card);

      document.getElementById('currentColor').style.background = {
        red: 'var(--red)', blue: 'var(--blue)', green: 'var(--green)', yellow: 'var(--yellow)'
      }[currentColor] || '#888';
    }

    function renderHand() {
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      const p = players[currentPlayer];
      if (mode === 'multi' && document.getElementById('passOverlay').classList.contains('show')) return;

      p.hand.forEach((card, idx) => {
        const el = createCardElement(card);
        const canPlay = isPlayable(card) && !waitingColor && !gameOver && !p.isAI;
        if (canPlay) el.classList.add('playable');
        el.onclick = () => { if (canPlay) playCard(idx); };
        handEl.appendChild(el);
      });
    }

    function createCardElement(card) {
      const el = document.createElement('div');
      el.className = `card ${card.color === 'wild' ? 'wild' : card.color}`;

      let display = card.value;
      if (card.value === 'skip') display = '⊘';
      else if (card.value === 'reverse') display = '⇄';
      else if (card.value === 'draw2') display = '+2';
      else if (card.value === 'wild') display = 'W';
      else if (card.value === 'wild4') display = '+4';

      el.innerHTML = `
        <span class="corner tl">${display}</span>
        <div class="oval"><span class="oval-val">${display}</span></div>
        <span class="corner br">${display}</span>
      `;
      return el;
    }

    function renderDirection() {
      const el = document.getElementById('direction');
      el.textContent = direction === 1 ? '➡️' : '⬅️';
      el.classList.toggle('reverse', direction === -1);
    }

    function updateTurnMsg() {
      const p = players[currentPlayer];
      document.getElementById('turnMsg').textContent = p.isAI ? 'Bot berpikir...' : (mode === 'multi' ? `Giliran ${p.name}` : 'Giliranmu');
    }

    function updateUnoBtn() {
      const btn = document.getElementById('unoBtn');
      const p = players[currentPlayer];
      const hasPlayable = p.hand.some(c => isPlayable(c));
      const show = !p.isAI && p.hand.length === 2 && hasPlayable && !calledUno[currentPlayer];
      btn.classList.toggle('show', show);
    }

    // ========== LOGIC ==========
    function isPlayable(card) {
      if (!card) return false;
      if (mustDraw > 0) return card.value === 'draw2' || card.value === 'wild4';
      if (card.color === 'wild') return true;
      const top = discard[discard.length - 1];
      return card.color === currentColor || card.value === top.value;
    }

    function playCard(idx) {
      if (gameOver || waitingColor) return;
      const p = players[currentPlayer];
      const card = p.hand[idx];
      if (!isPlayable(card)) return;

      p.hand.splice(idx, 1);
      discard.push(card);
      playSfx('play');
      if (card.color !== 'wild') currentColor = card.color;

      if (p.hand.length === 1 && p.isAI) calledUno[currentPlayer] = true;
      if (p.hand.length === 0) { endGame(currentPlayer); return; }

      applyEffect(card);
    }

    function applyEffect(card) {
      if (card.value === 'skip') {
        nextPlayer(); nextPlayer(); afterTurn();
      } else if (card.value === 'reverse') {
        direction *= -1;
        if (players.length === 2) nextPlayer();
        nextPlayer(); afterTurn();
      } else if (card.value === 'draw2') {
        mustDraw += 2; nextPlayer(); afterTurn();
      } else if (card.value === 'wild' || card.value === 'wild4') {
        if (card.value === 'wild4') mustDraw += 4;
        if (players[currentPlayer].isAI) {
          currentColor = pickBestColor(players[currentPlayer]);
          nextPlayer(); afterTurn();
        } else {
          waitingColor = true;
          document.getElementById('colorModal').classList.add('show');
        }
      } else {
        nextPlayer(); afterTurn();
      }
    }

    function chooseColor(color) {
      currentColor = color;
      waitingColor = false;
      document.getElementById('colorModal').classList.remove('show');
      nextPlayer(); afterTurn();
    }

    function nextPlayer() {
      currentPlayer = (currentPlayer + direction + players.length) % players.length;
    }

    function afterTurn() {
      calledUno[currentPlayer] = false;
      renderAll();

      if (mustDraw > 0) {
        const p = players[currentPlayer];
        const canStack = p.hand.some(c => c.value === 'draw2' || c.value === 'wild4');
        if (!canStack) {
          for (let i = 0; i < mustDraw; i++) {
            if (deck.length === 0) refillDeck();
            p.hand.push(deck.pop());
          }
          showToast(`${p.name} +${mustDraw} kartu`);
          mustDraw = 0;
          nextPlayer();
          renderAll();
        }
      }

      if (gameOver) return;
      if (players[currentPlayer].isAI) setTimeout(aiTurn, difficulty === 'impossible' ? 500 : 850);
      else if (mode === 'multi') showPassOverlay();
    }

    function drawCard() {
      if (gameOver || waitingColor || players[currentPlayer].isAI || mustDraw > 0) return;
      if (deck.length === 0) refillDeck();
      const card = deck.pop();
      players[currentPlayer].hand.push(card);
      playSfx('draw');
      showToast('Kartu diambil');
      if (!isPlayable(card)) {
        nextPlayer(); afterTurn();
      } else {
        renderAll();
      }
    }

    function refillDeck() {
      const top = discard.pop();
      deck = shuffle(discard);
      discard = [top];
    }

    function callUno() {
      calledUno[currentPlayer] = true;
      showToast('UNO! 🔥');
      document.getElementById('unoBtn').classList.remove('show');
    }

    function pickBestColor(p) {
      const counts = { red:0, blue:0, green:0, yellow:0 };
      p.hand.forEach(c => { if (c.color !== 'wild') counts[c.color]++; });
      return Object.entries(counts).sort((a,b) => b[1] - a[1])[0][0];
    }

    // ========== AI DIFFICULTIES ==========
    function aiTurn() {
      if (gameOver) return;
      const p = players[currentPlayer];

      // Must draw handling
      if (mustDraw > 0) {
        const stackIdx = p.hand.findIndex(c => c.value === 'draw2' || c.value === 'wild4');
        if (stackIdx >= 0 && (difficulty !== 'easy' || Math.random() > 0.4)) {
          playCard(stackIdx);
          return;
        }
        for (let i = 0; i < mustDraw; i++) {
          if (deck.length === 0) refillDeck();
          p.hand.push(deck.pop());
        }
        showToast(`Bot +${mustDraw} kartu`);
        mustDraw = 0;
        nextPlayer(); afterTurn();
        return;
      }

      const playable = [];
      p.hand.forEach((c, i) => { if (isPlayable(c)) playable.push({ card: c, idx: i }); });

      if (playable.length === 0) {
        if (deck.length === 0) refillDeck();
        const card = deck.pop();
        p.hand.push(card);
        playSfx('draw');
        if (isPlayable(card) && (difficulty !== 'easy' || Math.random() > 0.35)) {
          setTimeout(() => playCard(p.hand.length - 1), 350);
        } else {
          nextPlayer(); afterTurn();
        }
        return;
      }

      let chosen;
      if (difficulty === 'easy') {
        // Random + sometimes skip good plays
        chosen = playable[Math.floor(Math.random() * playable.length)];
        if (Math.random() < 0.25 && playable.length > 1) {
          // Prefer number cards randomly
          const nums = playable.filter(x => !isNaN(x.card.value));
          if (nums.length) chosen = nums[Math.floor(Math.random() * nums.length)];
        }
      } else if (difficulty === 'normal') {
        // Prefer actions > wild > numbers
        playable.sort((a, b) => priority(b.card) - priority(a.card));
        chosen = playable[0];
      } else {
        // Impossible: smartest
        chosen = bestImpossibleMove(playable, p);
      }

      if (p.hand.length === 2) calledUno[currentPlayer] = true;
      playCard(chosen.idx);
    }

    function priority(c) {
      if (c.value === 'wild4') return 6;
      if (c.value === 'draw2') return 5;
      if (c.value === 'skip' || c.value === 'reverse') return 4;
      if (c.value === 'wild') return 3;
      return 1;
    }

    function bestImpossibleMove(playable, p) {
      // 1. If can finish, do it
      const finish = playable.find(x => p.hand.length === 1);
      if (finish) return finish;

      // 2. Prefer +4 / +2 if opponent has few cards
      const opp = players[(currentPlayer + direction + players.length) % players.length];
      if (opp.hand.length <= 3) {
        const punish = playable.find(x => x.card.value === 'wild4' || x.card.value === 'draw2');
        if (punish) return punish;
      }

      // 3. Prefer action cards
      const actions = playable.filter(x => ['skip','reverse','draw2','wild4'].includes(x.card.value));
      if (actions.length) {
        actions.sort((a,b) => priority(b.card) - priority(a.card));
        return actions[0];
      }

      // 4. Keep wild for later, prefer matching numbers that reduce color variety
      const nonWild = playable.filter(x => x.card.color !== 'wild');
      if (nonWild.length) {
        // Prefer the color we have most of
        const counts = { red:0, blue:0, green:0, yellow:0 };
        p.hand.forEach(c => { if (c.color !== 'wild') counts[c.color]++; });
        nonWild.sort((a,b) => (counts[b.card.color] || 0) - (counts[a.card.color] || 0));
        return nonWild[0];
      }

      return playable[0];
    }

    // ========== PASS & PLAY ==========
    function showPassOverlay() {
      if (mode !== 'multi') return;
      document.getElementById('passName').textContent = `Giliran ${players[currentPlayer].name}`;
      document.getElementById('passOverlay').classList.add('show');
      document.getElementById('hand').innerHTML = '';
    }

    function revealHand() {
      document.getElementById('passOverlay').classList.remove('show');
      renderHand();
    }

    // ========== END ==========
    function endGame(winnerIdx) {
      gameOver = true;
      playSfx('win');
      const winner = players[winnerIdx];
      const isPlayerWin = mode === 'ai' && winnerIdx === 0;
      document.getElementById('trophy').textContent = isPlayerWin ? '🏆' : '🎉';
      document.getElementById('winnerText').textContent = `${winner.name} Menang!`;
      document.getElementById('scoreText').textContent = isPlayerWin ? 'Keren banget!' : (difficulty === 'impossible' ? 'Bot Impossible terlalu gila...' : 'GG!');
      document.getElementById('gameOverModal').classList.add('show');
    }

    function tryAgain() {
      document.getElementById('gameOverModal').classList.remove('show');
      mode = lastSettings.mode;
      difficulty = lastSettings.difficulty;
      numPlayers = lastSettings.numPlayers;
      startGame();
    }

    function backToLobby() {
      document.getElementById('gameOverModal').classList.remove('show');
      document.getElementById('game').style.display = 'none';
      document.getElementById('lobby').style.display = 'flex';
      bgm.pause();
    }

    function confirmLobby() {
      if (confirm('Kembali ke lobby? Progress akan hilang.')) backToLobby();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1700);
    }

    // Init
    selectMode('ai');
  </script>
</body>
